{{- if .Values.DYNAMIC_PEERS }}
kind: DaemonSet
{{- else }}
kind: Deployment
{{- end }}
apiVersion: apps/v1
metadata:
  # Different name per kind so `helm upgrade` cleanly deletes the old workload
  # when toggling DYNAMIC_PEERS (helm cannot patch a Deployment into a DaemonSet
  # under the same metadata.name -- it errors with "cannot change object Kind").
  name: {{ if .Values.DYNAMIC_PEERS }}ovn-central-master{{ else }}ovn-central{{ end }}
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/description: |
      OVN components: northd, nb and sb.
spec:
  {{- if .Values.DYNAMIC_PEERS }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  {{- else }}
  replicas: {{ include "kubeovn.nodeCount" . }}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  {{- end }}
  selector:
    matchLabels:
      app: ovn-central
  template:
    metadata:
      labels:
        app: ovn-central
        component: network
        type: infra
    spec:
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ovn-central
              topologyKey: kubernetes.io/hostname
        {{- include "kubeovn.masterNodeAffinity" . | nindent 8 }}
      priorityClassName: system-cluster-critical
      serviceAccountName: ovn-ovs
      automountServiceAccountToken: true
      hostNetwork: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: hostpath-init
          image: {{ .Values.global.registry.address }}/{{ .Values.global.images.kubeovn.repository }}:{{ .Values.global.images.kubeovn.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - "chown -R nobody: /var/run/ovn /etc/ovn /var/log/ovn"
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
            privileged: true
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/run/ovn
              name: host-run-ovn
            - mountPath: /etc/ovn
              name: host-config-ovn
            - mountPath: /var/log/ovn
              name: host-log-ovn
      containers:
        - name: ovn-central
          image: {{ .Values.global.registry.address }}/{{ .Values.global.images.kubeovn.repository }}:{{ .Values.global.images.kubeovn.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: 
          - bash
          - /kube-ovn/start-db.sh
          securityContext:
            runAsUser: {{ include "kubeovn.runAsUser" . }}
            privileged: false
            capabilities:
              add:
                - NET_BIND_SERVICE
                - SYS_NICE
          env:
            - name: ENABLE_SSL
              value: "{{ .Values.networking.ENABLE_SSL }}"
            - name: NODE_IPS
              value: "{{ .Values.MASTER_NODES | default (include "kubeovn.nodeIPs" .) }}"
            - name: DYNAMIC_PEERS
              value: "{{ .Values.DYNAMIC_PEERS | default false }}"
            - name: DYNAMIC_JOIN_TIMEOUT
              value: "{{ .Values.DYNAMIC_JOIN_TIMEOUT | default 30 }}"
            - name: MASTER_NODES_LABEL
              value: "{{ .Values.MASTER_NODES_LABEL }}"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IPS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIPs
            - name: ENABLE_BIND_LOCAL_IP
              value: "{{- .Values.func.ENABLE_BIND_LOCAL_IP }}"
            - name: PROBE_INTERVAL
              value: "{{ .Values.networking.PROBE_INTERVAL }}"
            - name: OVN_NORTHD_PROBE_INTERVAL
              value: "{{ .Values.networking.OVN_NORTHD_PROBE_INTERVAL}}"
            - name: OVN_LEADER_PROBE_INTERVAL
              value: "{{ .Values.networking.OVN_LEADER_PROBE_INTERVAL }}"
            - name: OVN_NORTHD_N_THREADS
              value: "{{ .Values.networking.OVN_NORTHD_N_THREADS }}"
            - name: ENABLE_COMPACT
              value: "{{ .Values.networking.ENABLE_COMPACT }}"
            - name: OVN_VERSION_COMPATIBILITY
              value: '{{ include "kubeovn.ovn.versionCompatibility" . }}'
          resources:
            requests:
              cpu: {{ index .Values "ovn-central" "requests" "cpu" }}
              memory: {{ index .Values "ovn-central" "requests" "memory" }}
            limits:
              cpu: {{ index .Values "ovn-central" "limits" "cpu" }}
              memory: {{ index .Values "ovn-central" "limits" "memory" }}
              ephemeral-storage: {{ index .Values "ovn-central" "limits" "ephemeral-storage" }}
          volumeMounts:
            - mountPath: /var/run/ovn
              name: host-run-ovn
            - mountPath: /etc/ovn
              name: host-config-ovn
            - mountPath: /var/log/ovn
              name: host-log-ovn
            - mountPath: /etc/localtime
              name: localtime
              readOnly: true
            - mountPath: /var/run/tls
              name: kube-ovn-tls
          {{- if .Values.DYNAMIC_PEERS }}
          # Readiness reflects "fully working cluster member": ovsdb is
          # cluster_member with a known leader for both NB and SB. Used
          # by Service endpoints AND by peer pods' recover() decisions
          # (anyPeerActiveAndReady) to distinguish a real active peer
          # from a stale `active` annotation. No liveness probe -- the
          # ovn-central-controller binary recovers in-process; killing
          # the container only makes it slower.
          readinessProbe:
            exec:
              command:
                - bash
                - /kube-ovn/ovn-central-controller-readiness.sh
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          {{- else }}
          readinessProbe:
            exec:
              command:
                - bash
                - /kube-ovn/ovn-healthcheck.sh
            periodSeconds: 15
            timeoutSeconds: 45
          livenessProbe:
            exec:
              command:
                - bash
                - /kube-ovn/ovn-healthcheck.sh
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 45
          {{- end }}
      nodeSelector:
        kubernetes.io/os: "linux"
      volumes:
        - name: host-run-ovn
          hostPath:
            path: /run/ovn
        - name: host-config-ovn
          hostPath:
            path: {{ .Values.OVN_DIR }}
        - name: host-log-ovn
          hostPath:
            path: {{ .Values.log_conf.LOG_DIR }}/ovn
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: kube-ovn-tls
          secret:
            optional: true
            secretName: kube-ovn-tls

